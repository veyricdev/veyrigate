services:
  mongo:
    image: mongo:7.0.43@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b # 7.0.43, pinned 2026-11-12 (DEBT-590)
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7.4.10-bookworm@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # 7.4.10-bookworm, pinned 2026-11-12 (DEBT-590)
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a # v1.21, pinned 2026-11-12 (DEBT-590)
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # profile "full": chạy BE cùng hạ tầng. Mặc định KHÔNG chạy.
  # be/Dockerfile sẽ được tạo ở task B7.3 — service dưới đây là khung khai báo trước.
  be:
    profiles: ["full"]
    build:
      context: ./be
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data: {}
  redis_data: {}
