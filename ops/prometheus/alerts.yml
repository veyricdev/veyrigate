# SSO IdP alert rules (B7.2, spec #16 / §10). Every expression is wrapped in sum(...) so it is
# correct with several app instances. Summaries never template a label (no identifiers).
# Check: promtool check rules ops/prometheus/alerts.yml && promtool test rules ops/prometheus/alerts.test.yml
groups:
  - name: sso-idp
    rules:
      - alert: SsoTokenReuseDetected
        expr: sum(increase(sso_audit_events_total{action="TOKEN_REUSE_DETECTED",result="failure"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Refresh token reuse detected (a refresh family was revoked)
          description: A rotated refresh token was replayed in the last 5 minutes. Check the TOKEN_REUSE_DETECTED audit events.

      - alert: SsoEmergencyKeyRotation
        expr: sum(increase(sso_signing_key_rotations_total{mode="emergency",result="success"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Emergency signing key rotation performed
          description: The previous signing key was dropped from JWKS; every token it signed is now invalid. Check the SIGNING_KEY_ROTATED audit events.

      - alert: SsoTokenErrorRatioHigh
        expr: >-
          sum(rate(sso_token_endpoint_errors_total{endpoint="token"}[5m]))
          / sum(rate(sso_http_request_duration_seconds_count{route="/token"}[5m])) > 0.25
          and sum(rate(sso_http_request_duration_seconds_count{route="/token"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 25% of /token requests end in an OAuth error
          description: Break down sso_token_endpoint_errors_total by error to see which code grows.

      - alert: SsoHttp5xxRatioHigh
        expr: >-
          sum(rate(sso_http_request_duration_seconds_count{status_class="5xx",route!="/metrics"}[5m]))
          / sum(rate(sso_http_request_duration_seconds_count{route!="/metrics"}[5m])) > 0.05
          and sum(rate(sso_http_request_duration_seconds_count{route!="/metrics"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of HTTP requests fail with 5xx
          description: Fail-closed paths (DB/Redis/KMS down) answer 5xx; check dependencies and logs.

      # Run 87 (DEBT-253, D87.8): written by ops/backup/mongo-backup.sh (node_exporter textfile) only after
      # every step of an encrypted backup succeeded. RPO 1 h => page after 2 h without a good backup, or
      # when the metric is missing altogether (job never ran / textfile collector broken).
      - alert: SsoMongoBackupStale
        expr: >-
          max(time() - veyrigate_backup_last_success_timestamp_seconds) > 7200
          or absent(veyrigate_backup_last_success_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No successful encrypted MongoDB backup for more than 2 hours
          description: The RPO of 1 hour is at risk. Check the backup job log of ops/backup/mongo-backup.sh and runbook-ops section 4.

      # Run 91 (DEBT-666, D91.2/D91.3): a detached write of /register, /forgot or the verification mail
      # resend failed. The page was the generic success page, so the user waits for a mail that never comes.
      - alert: SsoBackgroundWriteFailed
        expr: sum by (what) (increase(sso_background_write_failures_total{what=~"register|forgot|resend_verify"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: A registration, password reset or verification resend write failed in the background
          description: The user saw the success page but no account, token or mail was written. Check Mongo/SMTP and runbook-ops section 13.

      - alert: SsoAuthMailFailed
        expr: sum by (what) (increase(sso_background_write_failures_total{what="auth_mail"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: A verification or password reset mail could not be sent
          description: The token was written but the SMTP send failed. Check SMTP and runbook-ops section 13.

      # Run 95 (DEBT-683, D95.11): the SMTP mailer dropped mail, either because MAX_PENDING_MAIL sends were
      # already pending (SMTP slow/down, or a burst) or because mail was still pending at shutdown.
      - alert: SsoMailDropped
        expr: sum by (reason) (increase(sso_mail_dropped_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: The SMTP mailer dropped mail without sending it
          description: A full mail queue (queue_full) or a shutdown with mail pending (shutdown) lost verification, reset or notice mails. Check SMTP and runbook-ops section 13.

      # Run 97 (DEBT-218, D97.4): an audit write failed. Counters are incremented before the write, so
      # sso_audit_events_total (reuse, rotations) still moves; the sensitive operation answered 5xx (INV-25).
      - alert: SsoAuditWriteFailed
        expr: sum(increase(sso_audit_write_failures_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: An audit event could not be written to the audit log
          description: Sensitive operations fail closed (5xx) while the audit log cannot be written. Check Mongo and runbook-ops section 14.

      # Run 97 (DEBT-126, D97.10): authenticated admin tokens probing routes they may not use. Absolute
      # thresholds (admin traffic is too low for a stable ratio); tune them to real traffic.
      - alert: SsoAdminAccessDenied
        expr: sum(increase(sso_admin_auth_denied_total{reason=~"forbidden|insufficient_scope"}[15m])) >= 10
        labels:
          severity: warning
        annotations:
          summary: Admin API calls are repeatedly refused for missing scope or role
          description: A valid admin token keeps hitting routes it may not use. Check the ADMIN_ACCESS_DENIED audit events and runbook-ops section 15.

      - alert: SsoAdminInvalidTokenHigh
        expr: sum(rate(sso_admin_auth_denied_total{reason="invalid_token"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The admin API keeps refusing invalid bearer tokens
          description: Sustained invalid_token answers on the admin API (stale, revoked or forged tokens). Check runbook-ops section 15.

      # Run 97 (DEBT-618, D97.20): ADMIN_RECOVERED / ADMIN_BOOTSTRAPPED are written by CLIs; the app polls the
      # newest timestamp every 60 s. Fires for 30 min after the event (no `for`); 0 = no event never fires, and
      # a restart does not re-fire an older event. `max` merges replicas. The CLI JSON line stays the main path.
      - alert: SsoAdminRecovered
        expr: time() - max(sso_audit_alert_last_event_timestamp_seconds{action="ADMIN_RECOVERED"}) < 1800
        labels:
          severity: critical
        annotations:
          summary: A super_admin was restored with the admin-recover CLI (break-glass)
          description: An ADMIN_RECOVERED audit event was written in the last 30 minutes. Confirm it was a planned recovery (runbook-ops section 3d).

      - alert: SsoAdminBootstrapped
        expr: time() - max(sso_audit_alert_last_event_timestamp_seconds{action="ADMIN_BOOTSTRAPPED"}) < 1800
        labels:
          severity: warning
        annotations:
          summary: The admin control plane was bootstrapped with the db:bootstrap CLI
          description: An ADMIN_BOOTSTRAPPED audit event was written in the last 30 minutes. Expected on the first deploy only (runbook-deploy section 16).

      # Run 97 (DEBT-072, D97.16): the global per-client_id client-auth failure cap answered 429 (a botnet
      # rotating IPs against one client, or many unknown client_ids). scope="source" (one IP) is not alerted.
      - alert: SsoClientAuthGlobalLimit
        expr: sum by (scope) (increase(sso_client_auth_rate_limited_total{scope=~"client|unknown_client"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Client authentication hit the global per-client failure cap
          description: Many sources are failing client authentication for one client (or for unknown client ids). Check the log line client-auth global limit reached and runbook-ops section 16.
