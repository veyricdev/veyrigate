packages:
  - be
  - fe-admin
  - fe-sso-test
  - e2e

# Disable pnpm's new-release cooldown so pinned versions (e.g. NestJS 12.x)
# install reproducibly in dev and CI. We pin exact versions instead.
minimumReleaseAge: 0

# Native postinstall builds we trust (transitive dep of the eslint resolver).
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  unrs-resolver: true

# `pnpm audit` exceptions (B7.4, run 38). Every entry needs a reason and a re-review date; CI runs
# `pnpm audit --audit-level high` fail-closed, so anything not listed here blocks the merge.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 (high, ReDoS) - no patched release yet. Dev-only (jest -> micromatch); the
    # globs it parses are written by us in jest/CI config, never user input. Re-review by
    # 2027-01-18 or as soon as a fix ships / jest drops it (DEBT-226).
    - GHSA-vfj7-8cjw-p6xm

# Release-age pins (run 41, fe-admin A1): transitive deps of @tanstack/react-start 1.168.60 resolved
# to releases < 14 days old; pin to the newest release <= 2026-10-07 that still satisfies the
# parent's range (router-core/start-*: seroval ^1.6.7; router-generator: prettier ^3.9.6).
# Drop once the registry ages past them or Start is bumped (DEBT-267/228).
overrides:
  seroval: 1.6.8
  seroval-plugins: 1.6.8
  '@tanstack/router-generator>prettier': 3.9.9
  # Run 43 (fe-admin A5): openapi-typescript 7.13.0 (dev, ^1.34.6) resolved @redocly/openapi-core
  # 1.34.21 (2026-10-13, < 14 days); pin the newest older release (1.34.20, 2026-09-09).
  'openapi-typescript>@redocly/openapi-core': 1.34.20
