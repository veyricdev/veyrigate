# Dependabot (run 72, DEBT-466, plan §12). Version updates wait 14 days (cooldown, same rule as manual
# pins); cooldown never applies to security updates. Limits and manual steps: runbook-deploy §7.
# - docker: Dependabot has NO security updates for this ecosystem ⇒ an urgent Node/Debian CVE is a manual
#   bump (security exception). Both Dockerfiles use literal FROM lines (ARG in FROM is not resolved).
# - npm: the dependency graph does see the npm packages (alert #40, security PR #2; run 96 corrected the
#   old DEBT-500 note, DEBT-585). The security gate stays CI `pnpm audit --audit-level high`
#   (fail-closed) + manual security exception. The `ignore` entries below may also suppress security
#   PRs for those ranges: drop them with DEBT-694/695/714 (DEBT-699).
# - github-actions: security updates work and are not delayed by the cooldown.
# - A PR that bumps the `node` image must also change .nvmrc / .node-version / engines (by hand, DEBT-502).
# - Alerts / security updates are enabled in the repository Settings (not in this file).
version: 2
updates:
  - package-ecosystem: npm # pnpm 12 workspace, root pnpm-lock.yaml
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      # Run 96 (D96.9): TypeScript 7 ships no compiler API (ts-jest, typescript-eslint, Nest CLI,
      # openapi-typescript cannot run). 6.x is still proposed. Remove once migrated (DEBT-695).
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Run 96 (D96.10): Start 1.169 renames inputValidator and getResponseHeaders() returns a copy
      # (Set-Cookie refresh / no-store would be lost silently). Start 1.168.61 pins router 1.170.42
      # (run 98, D98.2).
      # Remove both once fe-admin is migrated (DEBT-694).
      - dependency-name: '@tanstack/react-start'
        versions: ['>=1.169.0']
      - dependency-name: '@tanstack/react-router'
        versions: ['>1.170.42']
      # Run 99 (D99.7): 1.65.0 WebKit driver asserts (_WKPage._onTargetCreated) on cross-site navigation
      # to a COOP same-origin page ⇒ X3 webkit 8/14. Remove once ≥ 1.65.1 keeps X3 webkit 14/14 (DEBT-714).
      - dependency-name: '@playwright/test'
        versions: ['1.65.0']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/be, /fe-admin]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major'] # a Node major is a deliberate migration
    groups:
      node-image: # be + fe-admin in one PR: both images always share the digest
        applies-to: version-updates
        patterns: [node]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
