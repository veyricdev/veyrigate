name: Dependency audit

# Scheduled supply-chain gate (run 85, DEBT-576): an advisory published between two pushes (mongoose,
# 2026-11-10) only surfaced on the next push. Same command as the CI "Dependency audit" step, fail-
# closed (a registry outage turns it red); accepted advisories live in pnpm-workspace.yaml
# auditConfig.ignoreGhsas. Remediation deadlines: runbook-deploy.md §14.
on:
  schedule:
    - cron: '41 2 * * *' # daily, 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high
