name: CodeQL

# SAST (B7.4, run 38): CodeQL `security-extended` over the TS/JS sources (be, fe-*, e2e). The repo is
# public, so code scanning is free. No build is needed for JS/TS (`build-mode: none`). Results go to
# the Security tab; first-run triage is tracked by DEBT-225.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '23 3 * * 1' # weekly, Monday 03:23 UTC (new queries on unchanged code)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the write scope is granted to the analyze job only.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
