name: CodeQL

# SAST (B7.4, run 38): CodeQL `security-extended` over the TS/JS sources (be, fe-*, e2e). The repo is
# public, so code scanning is free. No build is needed for JS/TS (`build-mode: none`). Results go to
# the Security tab; first-run triage is tracked by DEBT-225.
# Run 93 (DEBT-674, D93.7): test code is not scanned (`paths-ignore`; 17 of the 40 run-92 alerts were test code,
# dismissed one by one as "used in tests"). Still scanned: be/src (minus colocated specs), be/scripts, fe-admin/src,
# fe-sso-test/src, ops.
# Run 96 (DEBT-673): `.agents/` (vendored agent skills/plugins, referenced by the agent configs; never
# built into an image) is not scanned either: it is tooling, not product code.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '23 3 * * 1' # weekly, Monday 03:23 UTC (new queries on unchanged code)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the write scope is granted to the analyze job only.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - be/test/**
              - fe-admin/test/**
              - fe-sso-test/test/**
              - e2e/**
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - .agents/**

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
