name: CI

# Chặn merge khi CI đỏ: cần bật branch protection trên GitHub
# (Settings → Branches → require status checks "quality", "int", "e2e", "secrets", "promtool", "fe-admin-image", "be-image" + CodeQL).
# Không cấu hình được trong repo (DEBT-227).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Huỷ run cũ khi có push mới trên cùng ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm i --frozen-lockfile

      # Supply chain gate (B7.4): whole workspace incl. dev deps (they run here). Fail-closed: no
      # --ignore-registry-errors, a registry outage turns the job red (rerun by hand). Accepted
      # advisories live in pnpm-workspace.yaml auditConfig.ignoreGhsas, each with a reason.
      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm test

      # fe-admin (A1/A2, run 41): production build needs no server env/secret (validated at server
      # start, not at build); check:bundle fails if a server env name leaks into client assets.
      - name: fe-admin build + client bundle scan
        run: pnpm -C fe-admin build && pnpm -C fe-admin check:bundle

      # fe-admin (A5, run 43 F1): request types are generated from the committed OpenAPI snapshot;
      # regenerate and fail if schema.d.ts drifts from it (live BE vs snapshot: e2e admin-openapi.spec).
      - name: fe-admin API types match the OpenAPI snapshot
        run: pnpm -C fe-admin gen:api && git diff --exit-code -- fe-admin/src/server/admin-api/schema.d.ts

  # Integration suite bảo mật (B7.1): chạy `pnpm -C be test:int` y như local, trên service giống
  # vg-test-* (mongo@27117, redis@6479) + Mailpit (mailer.int-spec). KHÔNG đặt TEST_MONGO_URI /
  # TEST_REDIS_URL (override làm mọi spec dùng chung 1 DB, DEBT-203); không secret, không .env/keys
  # (int-spec không nạp ConfigModule, khoá ký dùng mkdtemp). Mongo single-node: chưa có
  # transaction/change stream, URI test dùng directConnection=true. Khi cần replica set: thay
  # service bằng step `docker run -d -p 27117:27017 mongo:7 --replSet rs0`, rồi
  # `mongosh --port 27117 --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'`
  # và chờ PRIMARY.
  int:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27117:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6479:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Integration tests (security suite)
        run: pnpm -C be test:int

      # Vault Transit KeyProvider (run 53): throwaway dev Vault, digest-pinned, loopback only. The
      # root token is random per run, masked before it is used, and only lives in this job's env
      # (no GitHub secret). `test:vault` FAILS (never skips) if Vault is not healthy.
      - name: Start Vault (dev, throwaway)
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN"
          docker run -d --name vg-ci-vault --cap-add=IPC_LOCK -e VAULT_DEV_ROOT_TOKEN_ID="$TOKEN" \
            -p 127.0.0.1:18200:8200 \
            hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18200/v1/sys/health)" = 200 ] && break
            sleep 1
          done
          echo "VAULT_TEST_ADDR=http://127.0.0.1:18200" >> "$GITHUB_ENV"
          echo "VAULT_TEST_ROOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Vault Transit tests
        run: pnpm -C be test:vault

  # E2E thật (DEBT-004 / X1): Playwright 1 kịch bản login → /authorize → /token → claims.
  # Mongo single-node (chưa dùng transaction — DEBT-083) + Redis service. Env BE/FE đều là giá trị
  # GIẢ không-secret: BE/FE do playwright.config.ts (e2e/config/env.ts) cấp qua webServer.env; chỉ
  # DEV_SEED_* đặt ở job env: (viết thẳng, KHÔNG dùng GitHub secrets). GH Actions tự set CI=true →
  # Playwright bật trace retain-on-failure + forbidOnly.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Credential user dev (giả, non-secret). Phải KHÁC ADMIN_SEED_EMAIL (e2e/config/env.ts).
      DEV_SEED_EMAIL: dev@example.com
      DEV_SEED_PASSWORD: dev-password-123
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Run E2E (Playwright builds/seeds/starts BE + FE)
        run: pnpm -C e2e e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Secret scan (B7.4, run 38): gitleaks over the WHOLE git history (fetch-depth: 0), same version as
  # the optional pre-commit hook (.pre-commit-config.yaml). Run from the upstream image pinned by
  # digest (not gitleaks-action: it needs a license for org-owned repos). `--redact` keeps any hit
  # out of the job log; `--exit-code 1` fails the job on a finding. Known fake values are
  # allowlisted, each with a reason, in .gitleaks.toml (picked up from the scanned repo root).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The repo is mounted into a third-party image: keep GITHUB_TOKEN out of .git/config (DEBT-232).
          persist-credentials: false

      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git /repo --redact --exit-code 1 --no-banner --verbose

  # Prometheus rules (DEBT-219): `promtool check rules` + `promtool test rules` from the upstream
  # image pinned by digest (v3.15.0). Locally the Jest `ops-rules.spec` covers names/annotations only.
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/ops/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          check rules /ops/prometheus/alerts.yml

      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/ops/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          test rules /ops/prometheus/alerts.test.yml

  # fe-admin image (run 52, A9): build the production image and run the smoke test against it
  # (non-root, healthcheck, headers on assets, 413, exit on bad env, image hygiene). Nothing is
  # pushed and no registry is logged into; fake .invalid URLs, secrets generated per run.
  fe-admin-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build image
        run: docker build -f fe-admin/Dockerfile -t veyrigate-fe-admin:ci .

      - name: Smoke test image
        run: bash fe-admin/scripts/docker-smoke.sh veyrigate-fe-admin:ci

  # IdP backend image (run 53b, B7.3): build the production image (and its build stage, scanned for
  # env/key files) and run the smoke test against throwaway Mongo/Redis/Vault (dev, TLS) containers on
  # a private network: non-root, healthcheck on /health, /ready, JWKS from Vault Transit, image hygiene,
  # Redis down => /ready 503, clean stop, exit on bad env, production refuses KEY_PROVIDER=local.
  # Nothing is pushed and no registry is logged into; every secret is generated per run inside the
  # script and masked (::add-mask::) before use.
  be-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build -f be/Dockerfile --target build -t veyrigate-be:ci-build .
          docker build -f be/Dockerfile -t veyrigate-be:ci .

      - name: Smoke test image
        run: bash be/scripts/docker-smoke.sh veyrigate-be:ci veyrigate-be:ci-build
