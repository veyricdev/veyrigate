name: CI

# Chặn merge khi CI đỏ: cần bật branch protection trên GitHub
# (Settings → Branches → require status checks "quality"). Không cấu hình được trong repo.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Huỷ run cũ khi có push mới trên cùng ref
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm test

  # E2E thật (DEBT-004 / X1): Playwright 1 kịch bản login → /authorize → /token → claims.
  # Mongo single-node (chưa dùng transaction — DEBT-083) + Redis service. Env BE/FE đều là giá trị
  # GIẢ không-secret: BE/FE do playwright.config.ts (e2e/config/env.ts) cấp qua webServer.env; chỉ
  # DEV_SEED_* đặt ở job env: (viết thẳng, KHÔNG dùng GitHub secrets). GH Actions tự set CI=true →
  # Playwright bật trace retain-on-failure + forbidOnly.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Credential user dev (giả, non-secret). Phải KHÁC ADMIN_SEED_EMAIL (e2e/config/env.ts).
      DEV_SEED_EMAIL: dev@example.com
      DEV_SEED_PASSWORD: dev-password-123
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm i --frozen-lockfile

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Run E2E (Playwright builds/seeds/starts BE + FE)
        run: pnpm -C e2e e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
